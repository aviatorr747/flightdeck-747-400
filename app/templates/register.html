{% extends "base.html" %}{% block title %}Join the crew | Flightdeck 747{% endblock %}{% block content %}<section class="auth-page"><div class="auth-card"><div class="section-kicker">CREW ACCESS / 02</div><h1>Join the <em>crew.</em></h1><p class="muted">Create an account to access the explorer.</p><form method="post" class="auth-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="username">Username</label><input id="username" name="username" autocomplete="username" required minlength="3" maxlength="30"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required maxlength="254"><label for="password">Password <span class="label-hint">12 characters minimum</span></label><input id="password" name="password" type="password" autocomplete="new-password" required minlength="12"><label for="confirm_password">Confirm password</label><input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" required><button class="button button-primary full-width" type="submit">Create account ↗</button></form><p class="auth-switch">Already a member? <a href="{{ url_for('auth.login') }}">Sign in</a></p></div></section>{% endblock %}
